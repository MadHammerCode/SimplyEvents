trigger:
- main

pool:
  name: Self-Host

steps:

# Debug: List all files so we can see where gradlew is hiding
  - script: |
      echo "Current working directory:"
      pwd
      echo "Listing all files:"
      ls -R
    displayName: 'Debug: List Files'
  - script: chmod +x gradlew
    displayName: 'Make gradlew executable'

  - task: Gradle@3
    inputs:
      gradleWrapperFile: 'gradlew'
      tasks: 'build'
      publishJUnitResults: true
      testResultsFiles: '**/TEST-*.xml'
      
      javaHomeOption: 'Path'
      jdkDirectory: '/usr/lib/jvm/java-21-openjdk-amd64'
