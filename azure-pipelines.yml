trigger:
- main

pool:
  name: Self-Host

stages:
- stage: Build
  displayName: 'Build and Push Stage'
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: 'buildAndPush'
        repository: 'localhost:5000/simplyevents' 
        Dockerfile: '**/Dockerfile'
        tags: |
          latest
          $(Build.BuildId)     
