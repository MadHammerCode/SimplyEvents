trigger:
- main

pool:
  name: Self-Host

stages:
- stage: Build
  displayName: 'Build and Push'
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      displayName: 'Build and Push to Registry'
      inputs:
        command: 'buildAndPush'
        repository: 'localhost:5000/simplyevents'
        Dockerfile: '**/Dockerfile'
        tags: |
          latest
          $(Build.BuildId)

- stage: Deploy
  displayName: 'Deploy to Server'
  dependsOn: Build   
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    - task: DockerCompose@0
      displayName: 'Run Application'
      inputs:
        containerregistrytype: 'Container Registry'
        dockerComposeFile: '**/docker-compose.yml'
        action: 'Run a Docker Compose service'
        serviceName: 'app'
        dockerComposeCommand: 'up -d --pull always'
