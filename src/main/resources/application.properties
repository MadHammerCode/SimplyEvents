spring.application.name=Event

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=developer
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

mockpay.baseUrl=http://localhost:8082
mockpay.sharedSecret=DEV_SECRET_123

storage.upload-dir=uploads
storage.max-size-bytes=5242880
storage.allowed-extensions=jpg,jpeg,png,gif,webp


billing.pdf-output-dir=billing/invoices
billing.hash-algorithm=SHA-256



