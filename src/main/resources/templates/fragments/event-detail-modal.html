<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="event-detail-modal">
    <div id="eventDetailModal" class="modal" aria-hidden="true">
        <div class="modal-backdrop" data-close></div>

        <div class="modal-content event-detail-modal" role="dialog" aria-labelledby="eventDetailTitle">
            <button
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                    data-close>
                &times;
            </button>

            <header class="event-detail-header">
                <div class="event-detail-header-left">
                    <p class="event-category-pill">
                        <span id="detailCategory">Category</span>
                    </p>
                    <h2 id="eventDetailTitle" class="event-title">
                        <span id="detailTitle">Event Title</span>
                    </h2>
                    <p class="event-subtitle">
                        <span id="detailDate">2025-11-21</span>
                        ·
                        <span id="detailTime">19:30</span>
                        ·
                        <span id="detailLocation">Dornbirn</span>
                    </p>
                </div>

                <div class="event-meta-item">
                    <span class="meta-label">Availability</span>
                    <span id="detailAvailability" class="meta-value"></span>
                </div>

                <div class="event-detail-header-right">
                    <span class="event-price-label">Price</span>
                    <span id="detailPrice" class="event-price-value">€ 25,00</span>
                    <span class="event-slots">
                        Available: <span id="detailSlots">10</span>
                    </span>
                </div>
            </header>

            <div class="event-detail-body">
                <div class="event-detail-image-wrapper">
                    <img id="detailImage"
                         class="event-detail-image"
                         src=""
                         alt="Event image">
                </div>
                <div class="event-meta-row-3">
                    <div class="event-meta-item">
                        <span class="meta-label">Equipment</span>
                        <span id="detailEquipment" class="meta-value"></span>
                    </div>
                    <div class="event-meta-item">
                        <span class="meta-label">Requirements</span>
                        <span id="detailRequirements" class="meta-value"></span>
                    </div>
                    <div class="event-meta-item">
                        <span class="meta-label">Cancellation deadline</span>
                        <span id="detailCancel" class="meta-value"></span>
                    </div>
                </div>

                <section class="event-description-block">
                    <h3>Description</h3>
                    <p id="detailDescription">
                        Detailed description of the event. This text will be loaded from the backend.
                    </p>
                </section>
            </div>

            <footer class="event-detail-footer">
                <div class="event-booking-info">

                </div>
                <div class="event-booking-actions">
                    <button class="btn secondary" data-close>
                        Close
                    </button>


                    <a id="openFullPageBtn" class="btn primary" href="#" style="display:none;">
                        Show event
                    </a>
                </div>
            </footer>
        </div>
    </div>
</div>
</body>
</html>
