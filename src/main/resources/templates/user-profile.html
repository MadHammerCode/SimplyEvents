<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SimplyEvents – My profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/user-profile.css">
</head>
<body>
<div class="page">
    <!-- Navbar -->
    <nav class="nav">
        <div class="nav-container">
            <a href="/dashboard" class="nav-logo">
                <img src="/images/simplyevents-logo.png" alt="SimplyEvents Logo" class="nav-logo-img">
                <span class="nav-logo-text">SimplyEvents</span>
            </a>

            <div class="nav-links" id="navLinks">
                <!-- Guest -->
                <a href="/login" class="nav-link nav-guest-only">Login</a>

                <!-- Logged-in: user dropdown -->
                <div class="nav-user-dropdown nav-auth-only hidden" id="userMenuWrapper">
                    <button class="nav-link nav-user-btn" id="navUserBtn" type="button" aria-haspopup="true" aria-expanded="false">
                        <span id="navUserName"></span>
                        <span class="nav-user-caret">▾</span>
                    </button>

                    <div class="nav-user-menu hidden" id="userMenu" role="menu">
                        <!-- CUSTOMER -->
                        <a class="nav-user-item hidden nav-menu-customer" href="/dashboard" role="menuitem">Dashboard</a>
                        <a class="nav-user-item hidden nav-menu-customer" href="/user-profile" role="menuitem">Profile</a>
                        <a class="nav-user-item hidden nav-menu-customer" href="/my-bookings" role="menuitem">My Bookings</a>

                        <!-- BACKOFFICE -->
                        <a class="nav-user-item hidden nav-menu-backoffice" href="/dashboard" role="menuitem">Dashboard</a>
                        <a class="nav-user-item hidden nav-menu-backoffice" href="/backoffice-dashboard" role="menuitem">Backoffice</a>
                        <a class="nav-user-item hidden nav-menu-backoffice" href="/frontoffice-checkin" role="menuitem">Check in</a>

                        <!-- FRONTOFFICE -->
                        <a class="nav-user-item hidden nav-menu-frontoffice" href="/dashboard" role="menuitem">Dashboard</a>
                        <a class="nav-user-item hidden nav-menu-frontoffice" href="/frontoffice-checkin" role="menuitem">Check in</a>

                        <div class="nav-user-sep"></div>

                        <!-- Logout -->
                        <button class="nav-user-item" id="logoutBtn" type="button" role="menuitem">Logout</button>
                    </div>
                </div>
            </div>

            <button id="navToggle" class="nav-toggle">☰</button>
        </div>
    </nav>

    <!-- Header with Title -->
    <header class="up-header">
        <div class="container up-header__inner">
            <h1 class="up-title">My profile</h1>
        </div>
    </header>

    <main class="up-main">
        <div class="container up-main__inner">

            <!-- PROFILE CARD -->
            <section class="up-card up-profile-card">
                <div class="up-avatar-wrapper">
                    <img id="avatarImg" src="/images/avatar-default.png" alt="Avatar" class="up-avatar">
                </div>
                <div class="up-profile-info">
                    <h2 id="profileName" class="up-profile-name">–</h2>
                    <p id="profileEmail" class="up-profile-email">–</p>
                    <p id="profileRole" class="up-profile-role">–</p>
                </div>
            </section>

            <!-- PERSONAL DATA -->
            <section class="up-card">
                <h2 class="up-card__title">Personal data</h2>

                <div id="errorBox" class="up-error-box hidden"></div>

                <div class="up-form-grid">

                    <div class="up-form-group">
                        <label for="firstName" class="up-label">First name *</label>
                        <input id="firstName" type="text" class="up-input">
                    </div>

                    <div class="up-form-group">
                        <label for="lastName" class="up-label">Last name *</label>
                        <input id="lastName" type="text" class="up-input">
                    </div>

                    <div class="up-form-group span-2">
                        <label for="email" class="up-label">Email *</label>
                        <input id="email" type="email" class="up-input">
                    </div>

                    <div class="up-form-group">
                        <label for="phone" class="up-label">Phone number</label>
                        <input id="phone" type="text" class="up-input">
                    </div>

                    <div class="up-form-group">
                        <label for="address" class="up-label">Address</label>
                        <input id="address" type="text" class="up-input">
                    </div>
                </div>

                <div class="up-actions">
                    <button type="button" id="btnSaveProfile" class="btn btn-primary">Save changes</button>
                </div>
            </section>

            <!-- PASSWORD CHANGE -->
            <section class="up-card">
                <h2 class="up-card__title">Change password</h2>

                <div id="passwordErrorBox" class="up-error-box hidden"></div>
                <div id="passwordSuccessBox" class="up-success-box hidden"></div>

                <div class="up-form-grid">
                    <div class="up-form-group">
                        <label for="currentPassword" class="up-label">Current password *</label>
                        <input id="currentPassword" type="password" class="up-input">
                    </div>

                    <div class="up-form-group">
                        <label for="newPassword" class="up-label">New password *</label>
                        <input id="newPassword" type="password" class="up-input">
                    </div>

                    <div class="up-form-group span-2">
                        <label for="confirmPassword" class="up-label">Confirm new password *</label>
                        <input id="confirmPassword" type="password" class="up-input">
                    </div>
                </div>

                <div class="up-actions">
                    <button type="button" id="btnChangePassword" class="btn btn-secondary">Update password</button>
                </div>
            </section>

        </div>
    </main>
</div>


<script src="/js/navbar.js" defer></script>
<script src="/js/user-profile.js" defer></script>
</body>
</html>
