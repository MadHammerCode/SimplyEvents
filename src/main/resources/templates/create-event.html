<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Event</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/forms.css">
</head>
<body>

<div th:insert="~{fragments/topbar :: topbar}"></div>

<main class="section">
    <div class="container">
        <h1>Create Event</h1>

        <!-- Message banner (hidden by default) -->
        <div id="pageMessage" class="msg-info" style="display:none; margin-bottom:12px; padding:10px; border-radius:8px;"></div>

        <form id="createEventForm" novalidate enctype="multipart/form-data">
            <input type="hidden" id="editEventId" name="editEventId" value="" />

            <fieldset class="form-group">
                <legend>Basic data</legend>
                <div class="form-row">
                    <div class="form-col">
                        <label for="title">Titel *</label>
                        <input id="title" name="title" type="text" required placeholder="yoga, skiing, hiking" />
                    </div>

                    <div class="form-col">
                        <label for="category">Category *</label>
                        <input id="category" name="category" type="text" placeholder="sports, culture, nature" required/>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <label for="location">Location *</label>
                        <input id="location" name="location" type="text" required placeholder="Dornbirn" />
                    </div>
                    <div class="form-col">
                        <label for="price">Price *(€)</label>
                        <input id="price" name="price" type="number" min="0" step="0.01" placeholder="0.00" required />
                    </div>
                </div>
            </fieldset>


            <fieldset class="form-group">
                <legend>Appointment</legend>
                <div class="form-row">
                    <div class="form-col">
                        <label for="date">Date</label>
                        <input id="date" name="date" type="date" />
                    </div>
                    <div class="form-col">
                        <label for="time">Time</label>
                        <input id="time" name="time" type="time" />
                    </div>
                </div>
            </fieldset>


            <fieldset class="form-group">
                <legend>Booking window</legend>
                <div class="form-row">
                    <div class="form-col" style="align-self:center;">
                        <label>
                            <input id="yearRound" name="yearRound" type="checkbox" /> Available all year
                        </label>
                    </div>
                    <div class="form-col">
                        <label for="bookingStart">Booking from</label>
                        <input id="bookingStart" name="bookingStart" type="date" />
                    </div>
                    <div class="form-col">
                        <label for="bookingEnd">Booking until</label>
                        <input id="bookingEnd" name="bookingEnd" type="date" />
                    </div>
                    <div class="form-col">
                        <label for="cancelDeadline">Cancellation deadline</label>
                        <input id="cancelDeadline" name="cancelDeadline" type="datetime-local" />
                    </div>
                </div>
            </fieldset>


            <fieldset class="form-group">
                <legend>Participants & Duration</legend>
                <div class="form-row">
                    <div class="form-col">
                        <label for="minParticipants">Min. Participants *</label>
                        <input id="minParticipants" name="minParticipants" type="number" min="1" step="1" placeholder="1" required/>
                    </div>
                    <div class="form-col">
                        <label for="maxParticipants">Max. Participants *</label>
                        <input id="maxParticipants" name="maxParticipants" type="number" min="1" step="1" placeholder="20" required />
                    </div>
                    <div class="form-col">
                        <label for="durationHours">Duration (hours) *</label>
                        <input id="durationHours" name="durationHours" type="number" min="1" step="1" placeholder="2" required />
                    </div>
                </div>
            </fieldset>


            <fieldset class="form-group">
                <legend>Description & Media</legend>
                <div class="full">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" placeholder="optional"></textarea>
                </div>

                <div class="full">
                    <label for="equipmentNeeded">Equipment needed</label>
                    <input id="equipmentNeeded" name="equipmentNeeded" type="text" placeholder="sports shoes, towel" />
                </div>

                <div class="full">
                    <label for="requirements">Requirements</label>
                    <textarea id="requirements" name="requirements" rows="3" placeholder="basic fitness, minimum age"></textarea>
                </div>

                <div class="full">
                    <label for="image">Event image</label>
                    <input id="image" name="file" type="file" accept="image/*" />
                </div>
            </fieldset>

            <p class="required-hint">* Required fields must be filled</p>

            <div class="actions">
                <a href="/dashboard" class="btn secondary">Cancel</a>
                <button type="submit" class="btn primary">Save</button>
            </div>
        </form>
    </div>
</main>

<script src="/js/create-event.js" defer></script>
<script>
  // If URL contains ?edit={id} then fetch the event and prefill the form
  (function () {
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('edit');
    if (!editId) return;
    fetch('/api/events/' + encodeURIComponent(editId))
      .then(res => {
        if (!res.ok) throw new Error('Could not load event');
        return res.json();
      })
      .then(ev => {
        const form = document.getElementById('createEventForm');
        if (!form) return;
        document.getElementById('editEventId').value = editId;
        form.title.value = ev.title || '';
        form.date.value = ev.date || '';
        form.time.value = ev.time || '';
        form.location.value = ev.location || '';
        form.price.value = ev.price || '';
        form.description.value = ev.description || '';
        form.category.value = ev.category || '';
        form.minParticipants.value = ev.minParticipants || '';
        form.maxParticipants.value = ev.maxParticipants || '';
        form.durationHours.value = ev.durationHours || '';
        form.equipmentNeeded.value = ev.equipmentNeeded || '';
        form.requirements.value = ev.requirements || '';
        form.bookingStart.value = ev.bookingStart || '';
        form.bookingEnd.value = ev.bookingEnd || '';
        form.cancelDeadline.value = ev.cancellationDeadline || '';
        form.yearRound.checked = !!ev.yearRound;
      })
      .catch(err => console.error('Prefill failed', err));
  })();
</script>
</body>
</html>
