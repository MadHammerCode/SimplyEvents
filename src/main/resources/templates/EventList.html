<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SimplyEvents - Event List</title>


    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/event-details.css">
    <link rel="stylesheet" href="/css/searchbar.css">


    <script src="/js/modal.js" defer></script>
    <script src="/js/event-detail.js" defer></script>
    <script src="/js/events-list.js" defer></script>
    <script src="/js/create-event.js" defer></script>
</head>
<body>

<div th:insert="~{fragments/topbar :: topbar}"></div>

<section class="search-bar-container">
    <form id="searchForm" class="search-bar">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input
                    id="searchInput"
                    type="text"
                    placeholder="Search events by title, location, category…"
                    autocomplete="off"
            />
        </div>
        <button type="submit" class="btn primary search-btn">Search</button>
    </form>
</section>

<div id="createEventModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-content" role="dialog" aria-labelledby="modalTitle">
        <button class="modal-close" type="button" aria-label="Close" data-close>&times;</button>
        <h2 id="modalTitle">Create new Event</h2>

        <form id="createEventForm" novalidate>
            <div class="form-grid">
                <div class="full">
                    <label for="title">Titel *</label>
                    <input id="title" name="title" type="text" required placeholder="yoga, skiing, hiking" />
                </div>

                <div>
                    <label for="date">Date *</label>
                    <input id="date" name="date" type="date" required />
                </div>
                <div>
                    <label for="time">Time *</label>
                    <input id="time" name="time" type="time" required />
                </div>

                <div class="full">
                    <label for="location">Location *</label>
                    <input id="location" name="location" type="text" required placeholder="Dornbirn" />
                </div>

                <div>
                    <label for="price">Price *(€)</label>
                    <input id="price" name="price" type="number" min="0" step="0.01" placeholder="0.00" required />
                </div>
                <div>
                    <label for="capacity">Capacity *</label>
                    <input id="capacity" name="capacity" type="number" min="1" step="1" placeholder="20" required />
                </div>

                <div class="full">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" placeholder="optional"></textarea>
                </div>

                <div class="full">
                    <label for="category">Category *</label>
                    <input id="category" name="category" type="text" placeholder="sports, culture, nature" required/>
                </div>

                <div>
                    <label for="minParticipants">Min. Participants *</label>
                    <input id="minParticipants" name="minParticipants" type="number" min="1" step="1" placeholder="1" required/>
                </div>

                <div>
                    <label for="maxParticipants">Max. Participants *</label>
                    <input id="maxParticipants" name="maxParticipants" type="number" min="1" step="1" placeholder="20" required />
                </div>

                <div>
                    <label for="durationHours">Duration (hours)</label>
                    <input id="durationHours" name="durationHours" type="number" min="1" step="1" placeholder="2" />
                </div>

                <div>
                    <label for="cancelDeadline">Cancellation deadline</label>
                    <input id="cancelDeadline" name="cancelDeadline" type="datetime-local" />
                </div>

                <div class="full">
                    <label for="equipmentNeeded">Equipment needed</label>
                    <input id="equipmentNeeded" name="equipmentNeeded" type="text" placeholder="sports shoes, towel" />
                </div>

                <div class="full">
                    <label for="requirements">Requirements</label>
                    <textarea id="requirements" name="requirements" rows="3" placeholder="basic fitness, minimum age"></textarea>
                </div>
            </div>

            <p class="required-hint">* Required fields must be filled</p>

            <div class="actions">
                <button type="button" class="btn secondary" data-close>Cancel</button>
                <button type="submit" class="btn primary">Save</button>
            </div>
        </form>
    </div>
</div>


<div th:replace="~{fragments/event-detail-modal :: event-detail-modal}"></div>


<main class="section">
    <div class="container">
        <h2>Event List</h2>
        <ul id="eventList" class="event-list"></ul>
        <p id="eventEmptyState" class="event-empty">No event saved yet.</p>
    </div>
</main>

</body>
</html>
