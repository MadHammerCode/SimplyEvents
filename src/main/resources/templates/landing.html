<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SimplyEvents – Find your next event</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/landing.css">
</head>
<body>
<div class="page">
    <header class="hero">
        <div class="container hero__inner">
            <div class="hero__content">
                <p class="hero__eyebrow">SimplyEvents</p>
                <h1 class="hero__title">
                    Find your next unforgettable event
                </h1>
                <p class="hero__subtitle">
                    Concerts, sports, business events, workshops and more – all in one place.
                </p>

                <!-- Search card -->
                <section class="search-card">
                    <div class="search-grid">
                        <div class="field">
                            <label for="searchKeyword" class="field__label">What are you looking for?</label>
                            <div class="field__input field__input--icon">
                                <span class="field__icon">🔍</span>
                                <input id="searchKeyword" type="text" placeholder="Keyword, event name …">
                            </div>
                        </div>
                        <div class="field">
                            <label for="searchLocation" class="field__label">Location</label>
                            <div class="field__input field__input--icon">
                                <span class="field__icon">📍</span>
                                <input id="searchLocation" type="text" placeholder="City or region">
                            </div>
                        </div>
                        <div class="field">
                            <label for="searchDate" class="field__label">Date</label>
                            <div class="field__input field__input--icon">
                                <span class="field__icon">📅</span>
                                <input id="searchDate" type="date">
                            </div>
                        </div>
                    </div>
                    <div class="search-actions">
                        <button type="button" id="searchButton" class="btn btn-primary">
                            Search events
                        </button>
                        <button type="button" id="discoverButton" class="btn btn-outline">
                            Discover all events
                        </button>
                    </div>
                </section>

                <!-- Categories -->
                <section class="hero-categories">
                    <p class="hero-categories__label">Popular categories</p>
                    <div id="categoryChips" class="chip-row">
                        <!-- Chips are inserted via JS -->
                    </div>
                </section>
            </div>

        </div>
    </header>
</div>


<script src="/js/landing.js" defer></script>
</body>
</html>
