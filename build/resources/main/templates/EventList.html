<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SimplyEvents - Event List</title>


    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/event-details.css">
    <link rel="stylesheet" href="/css/searchbar.css">


    <script src="/js/modal.js" defer></script>
    <script src="/js/event-detail.js" defer></script>
    <script src="/js/events-list.js" defer></script>
    <script src="/js/create-event.js" defer></script>
</head>
<body>

<div th:insert="~{fragments/topbar :: topbar}"></div>

<section class="search-bar-container">
    <form id="searchForm" class="search-bar">
        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input
                    id="searchInput"
                    type="text"
                    placeholder="Search events by title, location, category…"
                    autocomplete="off"
            />
        </div>
        <button type="submit" class="btn primary search-btn">Search</button>
    </form>
</section>

<div class="category-filter">
    <button class="cat-btn active" data-category="ALL">All</button>
    <button class="cat-btn" data-category="Sport">Sport</button>
    <button class="cat-btn" data-category="Culture">Culture</button>
    <button class="cat-btn" data-category="Nature">Nature</button>
    <button class="cat-btn" data-category="Extreme">Extreme</button>
</div>

<div th:replace="~{fragments/event-detail-modal :: event-detail-modal}"></div>


<main class="section">
    <div class="container">
        <h2>Event List</h2>
        <ul id="eventList" class="event-list"></ul>
        <p id="eventEmptyState" class="event-empty">No event saved yet.</p>
    </div>
</main>

</body>
</html>
